<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040714"/>
      <stop offset=".42" stop-color="#0e1740"/>
      <stop offset=".78" stop-color="#2c2668"/>
      <stop offset="1" stop-color="#4a3480"/>
    </linearGradient>
    <radialGradient id="horizon" cx=".5" cy="1" r=".75">
      <stop offset="0" stop-color="#38d5f5" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#6d5dfc" stop-opacity=".22"/>
      <stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
    <filter id="b80" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="b34" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="34"/></filter>
    <filter id="b9" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="b4" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- soft cloud banks -->
  <g filter="url(#b80)">
    <ellipse cx="260" cy="250" rx="380" ry="120" fill="#7c5cff" opacity=".55"/>
    <ellipse cx="1180" cy="170" rx="460" ry="110" fill="#3a7bff" opacity=".45"/>
    <ellipse cx="760" cy="470" rx="520" ry="110" fill="#d16ba5" opacity=".30"/>
    <ellipse cx="1420" cy="520" rx="320" ry="90" fill="#8b6cff" opacity=".40"/>
  </g>
  <g filter="url(#b34)">
    <ellipse cx="520" cy="330" rx="240" ry="48" fill="#f19ac6" opacity=".30"/>
    <ellipse cx="980" cy="400" rx="300" ry="52" fill="#ffb3c7" opacity=".22"/>
    <ellipse cx="200" cy="520" rx="260" ry="44" fill="#9b8cff" opacity=".35"/>
    <ellipse cx="1300" cy="330" rx="260" ry="44" fill="#6bd6ff" opacity=".28"/>
  </g>
  <rect y="480" width="1600" height="520" fill="url(#horizon)"/>
  <!-- blurred skyline (data-centre towers) -->
  <g filter="url(#b9)" fill="#0a0f26" opacity=".92">
    <rect x="0" y="760" width="120" height="240"/><rect x="110" y="700" width="90" height="300"/>
    <rect x="210" y="790" width="140" height="210"/><rect x="340" y="720" width="80" height="280"/>
    <rect x="430" y="770" width="170" height="230"/><rect x="600" y="690" width="100" height="310"/>
    <rect x="710" y="780" width="150" height="220"/><rect x="850" y="730" width="90" height="270"/>
    <rect x="950" y="790" width="160" height="210"/><rect x="1110" y="710" width="110" height="290"/>
    <rect x="1230" y="775" width="130" height="225"/><rect x="1360" y="740" width="90" height="260"/>
    <rect x="1450" y="790" width="150" height="210"/>
  </g>
  <!-- windows / bokeh -->
  <g filter="url(#b4)" opacity=".85">
    <g fill="#7be7ff"><rect x="120" y="730" width="10" height="6"/><rect x="150" y="760" width="10" height="6"/><rect x="350" y="750" width="8" height="6"/><rect x="620" y="720" width="10" height="6"/><rect x="640" y="770" width="10" height="6"/><rect x="870" y="760" width="8" height="6"/><rect x="1130" y="740" width="10" height="6"/><rect x="1380" y="770" width="8" height="6"/></g>
    <g fill="#ffd3a6"><rect x="240" y="820" width="10" height="6"/><rect x="470" y="810" width="10" height="6"/><rect x="740" y="820" width="10" height="6"/><rect x="990" y="830" width="10" height="6"/><rect x="1260" y="815" width="10" height="6"/><rect x="1480" y="830" width="10" height="6"/></g>
  </g>
  <g filter="url(#b9)">
    <circle cx="180" cy="880" r="22" fill="#38d5f5" opacity=".35"/><circle cx="520" cy="900" r="30" fill="#8b6cff" opacity=".35"/>
    <circle cx="900" cy="870" r="26" fill="#ffb3c7" opacity=".28"/><circle cx="1240" cy="905" r="34" fill="#38d5f5" opacity=".30"/>
    <circle cx="1500" cy="860" r="24" fill="#8b6cff" opacity=".35"/>
  </g>
</svg>
