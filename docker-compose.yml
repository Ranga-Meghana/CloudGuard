# Optional local dev stack: MongoDB + backend + frontend with hot reload.
#   docker compose up --build
# Frontend: http://localhost:5173   Backend: http://localhost:5000   Mongo: localhost:27017
version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports: ["5000:5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB_NAME: cloudguard
      SECRET_KEY: local-dev-secret-change-me-please-1234
      FRONTEND_URL: http://localhost:5173
      CLOUD_PROVIDER: simulated
      AUTO_SEED: "true"
      ALLOW_DEMO_LOGIN: "true"
      PORT: "5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["5173:80"]
    environment:
      VITE_API_URL: http://localhost:5000
    depends_on: [backend]

volumes:
  mongo_data:
